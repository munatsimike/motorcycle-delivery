[versions]
agp = "9.4.0"
kotlin = "2.2.20"
ksp = "2.3.12"
hilt = "2.60.1"
composeBom = "2026.09.00"
activity = "1.11.0"
lifecycle = "2.9.4"
navigation = "2.9.5"
hiltNavigation = "1.2.0"
room = "2.8.2"
datastore = "1.2.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
