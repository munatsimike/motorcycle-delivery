org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Empty precompiled AAR outputs are dropped from the Gradle transform cache, and AGP then skips every compiled library resource. Keep library file resources in the resource merge.
android.precompileDependenciesResources=false
