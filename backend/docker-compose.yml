# Local S3-compatible storage for private licence images. These credentials
# are development placeholders. Copy the matching names into backend/.env.
# Do not use them in production.
#
# MinIO removed minio/minio and minio/mc from Docker Hub. These pinned images
# are the PGSTY Silo fork of that server and client: the same MINIO_ROOT_*
# variables, server command, and mc bucket commands.

services:
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: licence-dev
      MINIO_ROOT_PASSWORD: licence-dev-password
    volumes:
      - licence-minio:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 licence-dev licence-dev-password; do sleep 2; done
        mc mb --ignore-existing local/licence-images
        mc anonymous set none local/licence-images

volumes:
  licence-minio:
